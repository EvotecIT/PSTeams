name: Test PowerShell

on:
    push:
        branches:
            - main
        paths-ignore:
            - '*.md'
            - 'Docs/**'
            - 'Examples/**'
            - '.gitignore'
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

env:
    DOTNET_VERSION: '10.x'
    BUILD_CONFIGURATION: 'Debug'

jobs:
    refresh-psd1:
        name: 'Refresh PSD1'
        runs-on: windows-latest
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PowerShell modules
              shell: pwsh
              run: |
                  Install-Module PSPublishModule -Force -Scope CurrentUser -AllowClobber

            - name: Refresh module manifest
              shell: pwsh
              env:
                  RefreshPSD1Only: 'true'
              run: |
                  ./Module/Build/Build-Module.ps1

            - name: Upload refreshed manifest
              uses: actions/upload-artifact@v4
              with:
                  name: psd1
                  path: Module/PSTeams/PSTeams.psd1

    test-windows-ps5:
        needs: refresh-psd1
        name: 'Windows PowerShell 5.1'
        runs-on: windows-latest
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download manifest
              uses: actions/download-artifact@v4
              with:
                  name: psd1
                  path: Module/PSTeams

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Install PowerShell modules
              shell: powershell
              run: |
                  Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
                  Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
                  Install-Module -Name PSWriteColor -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber

            - name: Build .NET solution
              run: |
                  dotnet restore TeamsX.sln
                  dotnet build TeamsX.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

            - name: Run PowerShell tests
              shell: powershell
              run: ./Module/PSTeams/PSTeams.Tests.ps1

    test-windows-ps7:
        needs: refresh-psd1
        name: 'Windows PowerShell 7'
        runs-on: windows-latest
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download manifest
              uses: actions/download-artifact@v4
              with:
                  name: psd1
                  path: Module/PSTeams

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Install PowerShell modules
              shell: pwsh
              run: |
                  Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
                  Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
                  Install-Module -Name PSWriteColor -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber

            - name: Build .NET solution
              run: |
                  dotnet restore TeamsX.sln
                  dotnet build TeamsX.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

            - name: Run PowerShell tests
              shell: pwsh
              run: ./Module/PSTeams/PSTeams.Tests.ps1

    test-ubuntu:
        needs: refresh-psd1
        name: 'Ubuntu PowerShell 7'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download manifest
              uses: actions/download-artifact@v4
              with:
                  name: psd1
                  path: Module/PSTeams

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Install PowerShell
              run: |
                  source /etc/os-release
                  wget -q https://packages.microsoft.com/config/ubuntu/$VERSION_ID/packages-microsoft-prod.deb
                  sudo dpkg -i packages-microsoft-prod.deb
                  sudo apt-get update
                  sudo apt-get install -y powershell

            - name: Install PowerShell modules
              shell: pwsh
              run: |
                  Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
                  Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
                  Install-Module -Name PSWriteColor -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber

            - name: Build .NET solution
              run: |
                  dotnet restore TeamsX.sln
                  dotnet build TeamsX.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

            - name: Run PowerShell tests
              shell: pwsh
              run: ./Module/PSTeams/PSTeams.Tests.ps1

    test-macos:
        needs: refresh-psd1
        name: 'macOS PowerShell 7'
        runs-on: macos-latest
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download manifest
              uses: actions/download-artifact@v4
              with:
                  name: psd1
                  path: Module/PSTeams

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Install PowerShell
              shell: bash
              run: |
                  if command -v pwsh >/dev/null 2>&1; then
                    pwsh --version
                    exit 0
                  fi

                  brew update
                  brew tap powershell/tap
                  brew install --cask powershell || brew install powershell/tap/powershell

            - name: Install PowerShell modules
              shell: pwsh
              run: |
                  Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
                  Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
                  Install-Module -Name PSWriteColor -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber

            - name: Build .NET solution
              run: |
                  dotnet restore TeamsX.sln
                  dotnet build TeamsX.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

            - name: Run PowerShell tests
              shell: pwsh
              run: ./Module/PSTeams/PSTeams.Tests.ps1
