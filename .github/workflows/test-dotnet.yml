name: Test .NET

on:
    push:
        branches:
            - main
        paths-ignore:
            - '*.md'
            - 'Docs/**'
            - 'Examples/**'
            - '.gitignore'
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

env:
    BUILD_CONFIGURATION: 'Release'
    TEST_VERBOSITY: minimal
    SUMMARIZE_FAILURES: true

jobs:
    test-windows:
        name: 'Windows'
        runs-on: windows-latest
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: |
                      8.x
                      10.x

            - name: Restore dependencies
              run: dotnet restore TeamsX.sln

            - name: Build solution
              run: dotnet build TeamsX.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

            - name: Run tests (.NET 8.0)
              run: dotnet test --test-modules TeamsX.Tests/bin/Release/net8.0/TeamsX.Tests.dll --minimum-expected-tests 23 --results-directory TestResults/net8 --report-xunit-trx --report-xunit-trx-filename TeamsX.Tests.net8.trx

            - name: Run tests (.NET 10.0)
              run: dotnet test --test-modules TeamsX.Tests/bin/Release/net10.0/TeamsX.Tests.dll --minimum-expected-tests 23 --results-directory TestResults/net10 --report-xunit-trx --report-xunit-trx-filename TeamsX.Tests.net10.trx --coverage --coverage-output coverage.cobertura.xml --coverage-output-format cobertura

            - name: Summarize failing tests
              if: failure() && env.SUMMARIZE_FAILURES == 'true'
              shell: pwsh
              run: |
                  $trxFiles = Get-ChildItem -Recurse -Filter *.trx
                  if ($trxFiles.Count -eq 0) {
                    Write-Host "No TRX files found for failure analysis"
                    exit 0
                  }

                  Write-Host "=== Failed Tests Summary ==="
                  $failureCount = 0

                  $trxFiles | ForEach-Object {
                    try {
                      Select-Xml -Path $_.FullName -XPath "//UnitTestResult[@outcome='Failed']" |
                        ForEach-Object {
                          $name = $_.Node.testName
                          $msg = $_.Node.Output.ErrorInfo.Message ?? "No error message available"
                          Write-Host "FAILED: $name"
                          Write-Host "   $msg"
                          $failureCount++
                        }
                    } catch {
                      Write-Host "Warning: Could not parse TRX file $($_.Name): $($_.Exception.Message)"
                    }
                  }

                  if ($failureCount -eq 0) {
                    Write-Host "No failed tests found in TRX files"
                  } else {
                    Write-Host "=== Total failed tests: $failureCount ==="
                  }

            - name: Upload test results
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: test-results-windows
                  path: '**/*.trx'

            - name: Upload coverage reports
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: coverage-reports-windows
                  path: '**/coverage.cobertura.xml'

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v7
              with:
                  files: '**/coverage.cobertura.xml'
                  fail_ci_if_error: false

    test-ubuntu:
        name: 'Ubuntu'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: |
                      8.x
                      10.x

            - name: Restore dependencies
              run: dotnet restore TeamsX.sln

            - name: Build solution
              run: dotnet build TeamsX.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

            - name: Run tests (.NET 10.0)
              run: dotnet test --test-modules TeamsX.Tests/bin/Release/net10.0/TeamsX.Tests.dll --minimum-expected-tests 23 --results-directory TestResults/net10 --report-xunit-trx --report-xunit-trx-filename TeamsX.Tests.net10.trx --coverage --coverage-output coverage.cobertura.xml --coverage-output-format cobertura

            - name: Upload test results
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: test-results-ubuntu
                  path: '**/*.trx'

            - name: Upload coverage reports
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: coverage-reports-ubuntu
                  path: '**/coverage.cobertura.xml'

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v7
              with:
                  files: '**/coverage.cobertura.xml'
                  fail_ci_if_error: false

    test-macos:
        name: 'macOS'
        runs-on: macos-latest
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: |
                      8.x
                      10.x

            - name: Restore dependencies
              run: dotnet restore TeamsX.sln

            - name: Build solution
              run: dotnet build TeamsX.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

            - name: Run tests (.NET 10.0)
              run: dotnet test --test-modules TeamsX.Tests/bin/Release/net10.0/TeamsX.Tests.dll --minimum-expected-tests 23 --results-directory TestResults/net10 --report-xunit-trx --report-xunit-trx-filename TeamsX.Tests.net10.trx --coverage --coverage-output coverage.cobertura.xml --coverage-output-format cobertura

            - name: Upload test results
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: test-results-macos
                  path: '**/*.trx'

            - name: Upload coverage reports
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: coverage-reports-macos
                  path: '**/coverage.cobertura.xml'

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v7
              with:
                  files: '**/coverage.cobertura.xml'
                  fail_ci_if_error: false
